{{ define "main" }}
  <article>
    <h1>{{ .Title }}</h1>
    <div class="prose" style="margin-bottom: var(--space-8);">
      {{ .Content }}
    </div>

    {{ if .Pages }}
      <div>
        {{ range .Pages.ByDate.Reverse }}
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-4); margin-bottom: var(--space-3);">
              <h2 style="margin: 0;">
                <a href="{{ .RelPermalink }}">{{ .Title }}</a>
              </h2>
              {{ if .Date }}
                <div class="timeline-date">{{ .Date.Format "January 2, 2006" }}</div>
              {{ end }}
            </div>
            {{ if .Params.description }}
              <p style="margin-bottom: 0; color: var(--text-muted);">{{ .Params.description }}</p>
            {{ end }}
          </div>
        {{ end }}
      </div>
    {{ end }}
  </article>
{{ end }}
