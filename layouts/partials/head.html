<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if eq .Title .Site.Title }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description | default "Security engineer & builder" }}{{ end }}">

<!-- Open Graph -->
<meta property="og:title" content="{{ if eq .Title .Site.Title }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}">
<meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description | default "Security engineer & builder" }}{{ end }}">
<meta property="og:type" content="{{ if eq .Type "home" }}website{{ else }}article{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
{{ if .Params.image }}<meta property="og:image" content="{{ .Params.image | absURL }}">{{ end }}

<!-- Twitter Card -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ if eq .Title .Site.Title }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}">
<meta name="twitter:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description | default "Security engineer & builder" }}{{ end }}">
{{ if .Params.image }}<meta name="twitter:image" content="{{ .Params.image | absURL }}">{{ end }}

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- CSS -->
{{ $css := resources.Get "css/main.css" | minify }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">

<!-- JSON-LD Person Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Blake Nipper",
  "jobTitle": "Security Engineer",
  "url": "https://bnipper-creator.github.io",
  "sameAs": [
    "https://github.com/bnipper-creator",
    "https://linkedin.com/in/blake-nipper"
  ],
  "description": "Security engineer with expertise in incident response, offensive security, and cloud security. Georgia Tech OMSCS student."
}
</script>

<!-- Theme preference script (prevent FOUC) -->
<script>
  (function() {
    const theme = localStorage.getItem('theme') ||
                  (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.className = theme;
  })();
</script>
