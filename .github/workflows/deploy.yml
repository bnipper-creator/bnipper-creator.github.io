name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          set -x
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.162.1/hugo_extended_0.162.1_linux-amd64.tar.gz
          tar xzf hugo_extended_0.162.1_linux-amd64.tar.gz
          sudo mv hugo /usr/local/bin/

      - name: Pre-build diagnostics
        run: |
          set -x
          echo "=== Hugo version ==="
          hugo version
          echo "=== Working directory ==="
          pwd
          echo "=== Content files ==="
          ls -la content/
          echo "=== Hugo config ==="
          cat hugo.toml
          echo "=== Config validation ==="
          hugo config

      - name: Build site
        run: |
          set -x
          echo "=== Starting Hugo build ==="
          hugo --minify 2>&1
          echo "=== Build completed ==="

      - name: Post-build diagnostics
        if: success()
        run: |
          set -x
          echo "=== Public directory ==="
          ls -la public/ | head -20
          echo "=== Site files count ==="
          find public -type f | wc -l

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3
